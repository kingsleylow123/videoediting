<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="vendor/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A0A0B; }
  #root { width: 100%; height: 100%; position: relative;
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; }
  .w { position: absolute; left: 60px; width: 880px; text-align: center; color: #FFFFFF;
    font-weight: 900; font-size: 150px; line-height: 1; letter-spacing: -0.02em; opacity: 0; }
  #a { top: 560px; }
  #b { top: 760px; }
  #c { top: 960px; color: #FFE600; }
  #d { top: 1250px; font-size: 64px; font-weight: 700; color: #D4D4D8; }
  #bar { position: absolute; left: 60px; top: 1190px; width: 880px; height: 10px; background: #FFE600;
    transform-origin: left center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
  <div id="a" class="w clip" data-start="0" data-duration="6" data-track-index="0">STOP</div>
  <div id="b" class="w clip" data-start="0" data-duration="6" data-track-index="1">BOOSTING</div>
  <div id="c" class="w clip" data-start="0" data-duration="6" data-track-index="2">POSTS.</div>
  <div id="bar" class="clip" data-start="0" data-duration="6" data-track-index="3"></div>
  <div id="d" class="w clip" data-start="0" data-duration="6" data-track-index="4">Run ads that book calls.</div>
  <audio id="s1" src="sfx/hit.wav" data-start="0.3" data-volume="0.6"></audio>
  <audio id="s2" src="sfx/hit.wav" data-start="0.9" data-volume="0.6"></audio>
  <audio id="s3" src="sfx/hit.wav" data-start="1.5" data-volume="0.7"></audio>
  <audio id="s4" src="sfx/whoosh.wav" data-start="2.0" data-volume="0.5"></audio>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.set("#bar", { scaleX: 0 }, 0);
  [["#a", 0.3], ["#b", 0.9], ["#c", 1.5]].forEach(([s, t]) =>
    tl.fromTo(s, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, t));
  tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 2.0);
  tl.fromTo("#d", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.2);
  tl.to([".w", "#bar"], { y: 60, opacity: 0, duration: 0.25, ease: "power2.in" }, 5.6);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
